# impedanz-server configuration — this single file is mounted into the
# container (or replaced via IMPEDANZ_CONFIG). Every value can also be
# overridden through environment variables, see src/config.rs.

# dual-stack listener: [::] keeps IPv6 first-class, IPv4 arrives mapped
bind_address: "[::]:80"

# directory with the static astro build
public_dir: "/public"

# tracing env-filter, e.g. "info" or "info,impedanz_server=debug,tower_http=debug"
log_filter: "info"

# sqlite database of the member api (users, sessions, events)
database_path: "/data/impedanz.db"

# uploaded event artwork, served under /media/
media_dir: "/data/media"

# session cookies carry the Secure flag; disable only for plain-http dev
cookie_secure: true

# bootstrap admin (only consumed while the users table is empty) —
# prefer the IMPEDANZ_INITIAL_ADMIN_* environment variables over yaml
# initial_admin_username: "paul"
# initial_admin_password: "..."
