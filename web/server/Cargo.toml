[package]
name = "impedanz-server"
version = "0.4.1"
edition = "2021"
description = "Serves the static impedanz.net site and hosts the IMPEDANZ API"
license = "AGPL-3.0-or-later"

# Versions are aligned with the mows workspace (projects/mows/Cargo.toml)
# so axum, utoipa and swagger-ui are known to be compatible.
[dependencies]
axum = { version = "=0.8.4", features = ["multipart"] }
tokio = { version = "1.45.0", features = ["macros", "rt-multi-thread", "signal", "net", "fs"] }
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.4", features = ["fs", "compression-full", "trace", "set-header"] }
utoipa = { version = "5.4.0", features = ["chrono", "uuid"] }
utoipa-axum = "0.2.0"
utoipa-swagger-ui = { version = "9.0.2", features = ["axum", "vendored"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_yaml_neo = "0.11.0"
thiserror = "2.0.12"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "chrono", "uuid", "migrate", "derive", "macros"] }
argon2 = "0.5.3"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.23.3", features = ["v4", "serde"] }
rand = "0.10.1"
sha2 = "0.11.0"
serde_json = "1.0.150"
axum-extra = { version = "=0.10.1", features = ["cookie"] }
infer = "0.19.0"
time = "0.3.47"

[profile.release]
strip = true
lto = true
codegen-units = 1

[dev-dependencies]
tempfile = "3.27.0"
