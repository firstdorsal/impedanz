routing: local
tls: false

reverseProxy:
    create: true
    network: impedanz-network

domain: impedanz.net

services:
    web:
        subdomain: ""
        build:
            enabled: true
            context: ../../web
            dockerfile: Dockerfile
        image: ghcr.io/firstdorsal/impedanz-web
        volume:
            # sqlite database + uploaded event artwork of the member api
            type: volume
            value: impedanz-web-data-dev
