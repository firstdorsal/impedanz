manifestVersion: "0.1"
metadata:
    name: impedanz
    description: "impedanz.net — static site + member API served by impedanz-server"
    version: "0.5"
spec:
    compose:
        providedSecrets:
            # bootstrap admin for the impedanz member API (web service);
            # only consumed while the users table is empty
            IMPEDANZ_INITIAL_ADMIN_USERNAME:
                default: paul
                optional: false
            IMPEDANZ_INITIAL_ADMIN_PASSWORD:
                default: null
                optional: false
