{{- $webHostname := mowsJoinDomain .services.web.subdomain (ternary "localhost" .domain (eq .routing "local")) -}}

services:
    web:
        {{- if eq .services.web.build.enabled true }}
        build:
            context: "{{ .services.web.build.context }}"
            dockerfile: "{{ .services.web.build.dockerfile }}"
        {{- else }}
        image: "{{ .services.web.image }}"
        {{- end }}
        container_name: impedanz-web
        restart: unless-stopped
        environment:
            # bootstrap admin for the member API — only used while the
            # users table is empty, harmless afterwards
            - IMPEDANZ_INITIAL_ADMIN_USERNAME=${IMPEDANZ_INITIAL_ADMIN_USERNAME:-}
            - IMPEDANZ_INITIAL_ADMIN_PASSWORD=${IMPEDANZ_INITIAL_ADMIN_PASSWORD:-}
        volumes:
            # sqlite database + uploaded event artwork
            - {{ .services.web.volume.value }}:/data
        networks:
            - {{ .reverseProxy.network }}
        labels:
            traefik:
                docker:
                    network: {{ .reverseProxy.network }}
                enable: true
                http:
                    routers:
                        impedanz-web:
                            rule: "Host(`{{ $webHostname }}`)"
                            entrypoints: {{ ternary "websecure" "web" .tls }}
                            service: impedanz-web
                            {{- if eq .tls true }}
                            tls:
                                certresolver: "default"
                                domains:
                                    - main: "{{ .domain }}"
                                      sans: "*.{{ .domain }}"
                            {{- end }}
                        {{- if ne .routing "local" }}
                        impedanz-web-www:
                            rule: "Host(`www.{{ .domain }}`)"
                            entrypoints: {{ ternary "websecure" "web" .tls }}
                            service: impedanz-web
                            middlewares: impedanz-www-redirect
                            {{- if eq .tls true }}
                            tls:
                                certresolver: "default"
                                domains:
                                    - main: "{{ .domain }}"
                                      sans: "*.{{ .domain }}"
                            {{- end }}
                    middlewares:
                        impedanz-www-redirect:
                            redirectregex:
                                regex: "^https?://www\\.(.+)"
                                replacement: "{{ ternary "https" "http" .tls }}://$${1}"
                                permanent: true
                        {{- end }}
                    services:
                        impedanz-web:
                            loadbalancer:
                                server:
                                    port: "80"

    {{- if eq .reverseProxy.create true }}
    traefik:
        image: traefik:v3
        container_name: impedanz-traefik
        restart: unless-stopped
        command:
            - "--providers.docker=true"
            - "--entrypoints.web.address=:80"
        networks:
            - {{ .reverseProxy.network }}
        ports:
            - "80:80"
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
    {{- end }}

{{- if eq .services.web.volume.type "volume" }}
volumes:
    {{ .services.web.volume.value }}:
{{- end }}

networks:
    {{ .reverseProxy.network }}:
        {{- if ne .reverseProxy.create true }}
        external: true
        {{- else }}
        name: {{ .reverseProxy.network }}
        {{- end }}
